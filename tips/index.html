$('help').onclick=()=>show('整理范围与原文规则',`<div class="info">本次目标：让每条小tips可检索、可比较、可领取，并能回到具体版本核对。</div><p>范围：当前资源库的 ${D.sources.length} 个索引版本。${D.sources.length} 张定版与 ${D.sources.length} 张预览均已核对存在；Q34 在资源库退役清单中，未纳入。</p><p>${D.rows.filter(r=>r.sourceType==='文案原文').length} 条文案记录按源数组连续行切分，另列 ${D.rows.filter(r=>r.sourceType==='图片可见原文').length} 条图片原文记录；源中文原样保留；中文缺失或错配时另列“新增翻译（按外文）”。所有 ${D.coverage.length} 行来源文字（含明确标注的图片转录）均保留在 Excel「原文逐行」。</p><p>主题板块由整理者命名，仅用于检索。相同主题可能包含不同、相反或不同产品的说法；不视为完全同义。产品植入和互动引导均保留，可按类型筛选。</p><p>相同外文合并为一张卡片，所有来源版号均保留。中文直接显示在外文上方；可能因版本不同而不同，点击对应版号查看。领取默认取卡片首个来源；要取其他版，请点版号后加入清单。</p><p>图片与文案有差异时分别展示；本库不是对内容真实性的核验或修订。医疗及产品效果表述均为来源原文。</p><p class="context">索引更新时间：${esc(D.built)}<br>来源：${esc(D.root)}<br>新增小tips经惠跃明确授权后更新上线。</p>`);
$('metrics').innerHTML=`<div><b>${D.groups.length}</b><span>主题板块</span></div><div><b>${new Set(D.rows.map(r=>r.text)).size}</b><span>外文原文形态</span></div><div><b>${D.sources.length}</b><span>来源版本</span></div><div><b>${D.rows.length}</b><span>可追溯记录</span></div>`;$('version').innerHTML+=D.sources.map(s=>`<option>${esc(s.code)}</option>`).join('');const requested=new URLSearchParams(location.search).get('version');if(D.sources.some(s=>s.code===requested))$('version').value=requested;persist();render();
</script></body></html>
