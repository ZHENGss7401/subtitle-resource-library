function showBasket(){const rs=D.rows.filter(r=>basket.has(r.id));show('领取清单 · '+rs.length+' 条',`<p class="context">按当前语言导出，附原标题与来源。清单只保存在当前浏览器，可重复领取。</p>`+(rs.length?rs.map(r=>`<div class="basketrow"><div><strong>${esc(r.code)} / ${esc(r.topic)}</strong><pre>${esc(selectedText(r)||'此来源未提供中文原文')}</pre></div><button data-remove="${esc(r.id)}">移除</button></div>`).join(''):'<div class="empty">清单为空。先挑选喜欢的原文形态。</div>'))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset;if(a.topic!==undefined){active=a.topic;render()}if(a.detail)detail(a.detail);if(a.copy){const r=D.rows.find(r=>r.id===a.copy);copy(selectedText(r))}if(a.add){toggle(a.add);if(b.closest('dialog'))detail(a.add)}if(a.remove){basket.delete(a.remove);persist();render();showBasket()}});
for(const id of ['q','version','kind'])$(id).addEventListener(id==='q'?'input':'change',()=>{active='';render()});$('recent').onclick=()=>{recentOnly=!recentOnly;active='';$('version').value='';$('q').value='';$('recent').classList.toggle('primary',recentOnly);render()};$('clear').onclick=()=>{recentOnly=false;$('recent').classList.remove('primary');active='';$('q').value='';$('version').value='';$('kind').value='';render()};$('close').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close()});$('basket').onclick=showBasket;$('copyAll').onclick=()=>copy(D.rows.filter(r=>basket.has(r.id)).map(packet).join('\n\n────────────\n\n'));$('download').onclick=()=>{const t=D.rows.filter(r=>basket.has(r.id)).map(packet).join('\n\n────────────\n\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='BOREAC小tips领取清单.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载领取清单')};$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'切换浅色':'切换深色'};
$('fontSize').onclick=()=>{document.body.classList.toggle('large');$('fontSize').textContent=document.body.classList.contains('large')?'标准字号':'大字阅读'};
$('help').onclick=()=>show('整理范围与原文规则',`<div class="info">本次目标：让每条小tips可检索、可比较、可领取，并能回到具体版本核对。</div><p>范围：当前资源库的 ${D.sources.length} 个索引版本。${D.sources.length} 份字幕资源与 ${D.sources.length} 张预览均已核对存在；Q34 在资源库退役清单中，未纳入。</p><p>${D.rows.filter(r=>r.sourceType==='文案原文').length} 条文案记录按源数组连续行切分，另列 ${D.rows.filter(r=>r.sourceType==='图片可见原文').length} 条图片原文记录；源中文原样保留；中文缺失或错配时另列“新增翻译（按外文）”。所有 ${D.coverage.length} 行来源文字（含明确标注的图片转录）均保留在 Excel「原文逐行」。</p><p>主题板块由整理者命名，仅用于检索。相同主题可能包含不同、相反或不同产品的说法；不视为完全同义。产品植入和互动引导均保留，可按类型筛选。</p><p>相同外文合并为一张卡片，所有来源版号均保留。中文直接显示在外文上方；可能因版本不同而不同，点击对应版号查看。领取默认取卡片首个来源；要取其他版，请点版号后加入清单。</p><p>图片与文案有差异时分别展示；本库不是对内容真实性的核验或修订。医疗及产品效果表述均为来源原文。</p><p class="context">索引更新时间：${esc(D.built)}<br>来源：${esc(D.root)}<br>新增小tips经惠跃明确授权后更新上线。</p>`);
$('metrics').innerHTML=`<div><b>${D.groups.length}</b><span>主题板块</span></div><div><b>${new Set(D.rows.map(r=>r.text)).size}</b><span>外文原文形态</span></div><div><b>${D.sources.length}</b><span>来源版本</span></div><div><b>${D.rows.length}</b><span>可追溯记录</span></div><div><b>${D.alignment.coveredVersions}/${D.alignment.subtitleVersions}</b><span>字幕版本已对齐</span></div>`;$('version').innerHTML+=D.sources.map(s=>`<option>${esc(s.code)}</option>`).join('');const requested=new URLSearchParams(location.search).get('version');if(D.sources.some(s=>s.code===requested))$('version').value=requested;persist();render();
</script></body></html>
